name: Validate reproducible release sources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate release locks and tracked files
        run: python3 tools/check_repository.py
      - name: Test offline reproduction and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Check historical installer syntax
        run: bash -n installer/install.sh
      - name: Validate Compose with synthetic credentials
        run: python3 tools/check_compose.py
