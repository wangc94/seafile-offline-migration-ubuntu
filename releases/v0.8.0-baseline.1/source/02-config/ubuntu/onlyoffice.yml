---
services:
  caddy:
    ports:
      - ${ONLYOFFICE_PORT:-6233}:${ONLYOFFICE_PORT:-6233}

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:8.1.0.1}
    restart: unless-stopped
    container_name: seafile-onlyoffice
    hostname: "${RABBITMQ_HOSTNAME:-05831744982c}"
    environment:
      #- DB_TYPE=${DB_TYPE:-mariadb}
      #- DB_HOST=${SEAFILE_MYSQL_DB_HOST:-db}
      #- DB_USER=${SEAFILE_MYSQL_DB_USER:-seafile}
      #- DB_PWD=${SEAFILE_MYSQL_DB_PASSWORD:?Variable is not set or empty}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?Variable is not set or empty}
    volumes:
      - ${ONLYOFFICE_VOLUME:-/opt/onlyoffice}/logs:/var/log/onlyoffice
      - ${ONLYOFFICE_VOLUME:-/opt/onlyoffice}/data:/var/www/onlyoffice/Data
      - ${ONLYOFFICE_VOLUME:-/opt/onlyoffice}/lib:/var/lib/onlyoffice
      - /opt/onlyoffice-fonts:/usr/share/fonts/truetype/custom:ro
      - onlyoffice-postgresql:/var/lib/postgresql
      - onlyoffice-rabbitmq:/var/lib/rabbitmq
      - onlyoffice-redis:/var/lib/redis
    labels:
      caddy: ${SEAFILE_SERVER_PROTOCOL:-http}://${SEAFILE_SERVER_HOSTNAME:?Variable is not set or empty}:${ONLYOFFICE_PORT:-6233}
      caddy.reverse_proxy: "{{upstreams}}"
    networks:
      - seafile-net

volumes:
  onlyoffice-postgresql:
    external: true
    name: ${ONLYOFFICE_PG_VOLUME:-seafile-onlyoffice-postgresql}
  onlyoffice-rabbitmq:
    external: true
    name: ${ONLYOFFICE_RABBIT_VOLUME:-seafile-onlyoffice-rabbitmq}
  onlyoffice-redis:
    external: true
    name: ${ONLYOFFICE_REDIS_VOLUME:-seafile-onlyoffice-redis}

networks:
  seafile-net:
    name: seafile-net
